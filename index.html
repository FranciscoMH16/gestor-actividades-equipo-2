<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Actividades Académicas</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>Gestor de Actividades Académicas</h1>
        <p>Sistema de gestión y seguimiento de tareas colaborativas</p>
    </header>

    <main class="container">
        <!-- Sección para el formulario -->
        <section class="card" id="seccion-formulario">
            <h2>Registrar Nueva Actividad</h2>
            <!-- Formulario agregado-->
             <div id="contenedor-formulario">
                <form id="formulario-actividad">

                    <label for="nombre">Nombre de la actividad:</label>
                    <input type="text" id="nombre" name="nombre" required>
                    
                    <label for="descripcion">Descripción:</label>
                    <textarea id="descripcion" name="descripcion" required></textarea>
                    
                    <label for="responsable">Responsable:</label>
                    <input type="text" id="responsable" name="responsable" required>
                    
                    <label for="prioridad">Prioridad:</label>
                    <select id="prioridad" name="prioridad" required>
                        <option value="">Seleccionar prioridad</option>
                        <option value="Alta">Alta</option>
                        <option value="Media">Media</option>
                        <option value="Baja">Baja</option>
                    </select>
                    
                    <label for="estado">Estado:</label>
                    <select id="estado" name="estado" required>
                        <option value="">Seleccionar estado</option>
                        <option value="Pendiente">Pendiente</option>
                        <option value="En progreso">En progreso</option>
                        <option value="Completada">Completada</option>
                    </select>
                    
                    <button type="submit">Registrar actividad</button>
                
                </form>
            </div>
        </section>

            <!-- Sección para lista de tareas  -->
            <section class="card" id="seccion-listado">
                <h2>Listado de Actividades</h2>
                <table id="contenedor-listado">
                    <!-- Listado de actividades -->
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Responsable</th>
                            <th>Prioridad</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>    
        </main>

    <footer>
        <p>Proyecto colaborativo - Equipo 2</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
